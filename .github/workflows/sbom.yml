# sscsb: SBOM generation (Syft via anchore/sbom-action, CycloneDX JSON) for
# the default branch. The RELEASE SBOM is produced inside release.yml, bound to
# the tarball digest via an SBOM attestation, and uploaded to the DRAFT
# release before publish — so this workflow no longer runs on `release:
# published` (an asset upload after publish is exactly what release
# immutability forbids) and needs no write permission.
name: SBOM
on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json
          upload-release-assets: false
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
