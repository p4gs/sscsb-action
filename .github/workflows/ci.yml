# Self-test: run the action against this very repository and assert the
# record it produces exists and parses. Conventions: SHA-pinned actions,
# least-privilege permissions, harden-runner first, persist-credentials off.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    name: self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Harden runner
        # harden-runner supports Linux runners only; skipped on macOS.
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run the action against this repository
        id: scan
        uses: ./
        with:
          submit: "false"
          # sscsb v0.3.0 (first release with `sscsb verify --format json`) is
          # published, so the self-test exercises the same "latest" download
          # path consumers get by default.
          sscsb-version: "latest"
      - name: Assert the record exists and parses
        shell: bash
        env:
          RECORD_PATH: ${{ steps.scan.outputs.record-path }}
          GRADE: ${{ steps.scan.outputs.grade }}
        run: |
          set -euo pipefail
          test -s "$RECORD_PATH" || { echo "::error::scan-record.json missing or empty at ${RECORD_PATH}"; exit 1; }
          bun -e '
            const r = await Bun.file(process.env.RECORD_PATH!).json();
            if (r.schema_version !== 1) throw new Error(`schema_version ${r.schema_version} != 1`);
            if (!Array.isArray(r.controls) || r.controls.length === 0) throw new Error("controls empty");
            if (typeof r.score?.grade !== "string") throw new Error("score.grade missing");
            if (!/^[0-9a-f]{40}$/.test(r.repo?.commit ?? "")) throw new Error("repo.commit not a 40-hex sha");
            console.log(`record OK: ${r.repo.owner}/${r.repo.name} grade ${r.score.grade} (${r.score.overall_percent ?? "no evidence"}%)`);
          '
          test -n "$GRADE" || { echo "::error::grade output is empty"; exit 1; }
          echo "grade output: ${GRADE}"
