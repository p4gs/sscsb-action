# Self-test: run the action against this very repository and assert the
# record it produces exists and parses. Conventions: SHA-pinned actions,
# least-privilege permissions, harden-runner first, persist-credentials off.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    name: self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # exercise record signing end-to-end (no secret; GitHub's OIDC token)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Harden runner
        # harden-runner supports Linux runners only; skipped on macOS.
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run the action against this repository
        id: scan
        uses: ./
        with:
          submit: "false"
          # `latest` (v0.3.0+, which ships `verify --format json`) exercises the
          # real install path: release tarball, .sha256 sidecar, AND the
          # Sigstore bundle verified against sscs-bootstrapper's release
          # workflow identity. `build` would bypass all of that.
          sscsb-version: "latest"
      - name: Assert the record exists and parses
        shell: bash
        env:
          RECORD_PATH: ${{ steps.scan.outputs.record-path }}
          GRADE: ${{ steps.scan.outputs.grade }}
        run: |
          set -euo pipefail
          test -s "$RECORD_PATH" || { echo "::error::scan-record.json missing or empty at ${RECORD_PATH}"; exit 1; }
          bun -e '
            const r = await Bun.file(process.env.RECORD_PATH!).json();
            if (r.schema_version !== 1) throw new Error(`schema_version ${r.schema_version} != 1`);
            if (!Array.isArray(r.controls) || r.controls.length === 0) throw new Error("controls empty");
            if (typeof r.score?.grade !== "string") throw new Error("score.grade missing");
            if (!/^[0-9a-f]{40}$/.test(r.repo?.commit ?? "")) throw new Error("repo.commit not a 40-hex sha");
            console.log(`record OK: ${r.repo.owner}/${r.repo.name} grade ${r.score.grade} (${r.score.overall_percent ?? "no evidence"}%)`);
          '
          test -n "$GRADE" || { echo "::error::grade output is empty"; exit 1; }
          echo "grade output: ${GRADE}"
      - name: Assert the record is signed and the signature verifies
        # Same-repo runs hold id-token: write, so `sign: auto` must have
        # produced a bundle; verify it exactly the way the directory does,
        # pinned to THIS repository's CI workflow. Fork PRs get no OIDC token
        # and legitimately produce an unsigned record — detected inside the
        # script (the runner-injected variable is not in the `env` context).
        shell: bash
        env:
          RECORD_PATH: ${{ steps.scan.outputs.record-path }}
          SIGNED: ${{ steps.scan.outputs.signed }}
          BUNDLE_PATH: ${{ steps.scan.outputs.bundle-path }}
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::notice::no OIDC token in this run (fork PR) — signing legitimately skipped; nothing to verify"
            [ "$SIGNED" = "false" ] || { echo "::error::signed=${SIGNED} without an OIDC token?"; exit 1; }
            exit 0
          fi
          [ "$SIGNED" = "true" ] || { echo "::error::record not signed although the job holds id-token: write"; exit 1; }
          test -s "$BUNDLE_PATH" || { echo "::error::bundle missing at ${BUNDLE_PATH}"; exit 1; }
          cosign verify-blob "$RECORD_PATH" --bundle "$BUNDLE_PATH" \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/ci\.yml@" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          echo "signature verified against ${GITHUB_REPOSITORY}/.github/workflows/ci.yml"
