# sscsb: immutability-compatible release (draft-then-publish) for this
# composite GitHub Action. The shipped artifact is the action's source tree at
# the tag — exactly the bytes a consumer gets from `uses: p4gs/sscsb-action@<tag>`
# — packaged with `git archive` (tracked files only, commit-time mtimes, so the
# tarball is reproducible from the tag). That tarball is what gets attested,
# signed, gated, and published:
#
#   build      → git archive + sha256 sidecar (+ the sha256 line, base64, as the
#                SLSA subject for the provenance job)
#              → SLSA build provenance to GitHub's attestation store
#                (actions/attest-build-provenance, SLSA Build L2)
#              → CycloneDX SBOM (Syft) + SBOM attestation bound to the tarball
#                digest (actions/attest)
#              → Cosign keyless sign-blob bundles (cert + sig + Rekor proof)
#   provenance → slsa-framework/slsa-github-generator generic_slsa3 (SLSA Build
#                L3): the *.intoto.jsonl is emitted as a WORKFLOW ARTIFACT
#                (`upload-assets: false`) — the generator never touches the
#                release, so immutability is not at stake.
#   gate       → .github/workflows/deploy-gate.yml (reusable): re-checks the
#                checksums, verifies every Cosign bundle against THIS workflow's
#                identity, verifies the L3 provenance with slsa-verifier against
#                the pinned generator, and verifies both store attestations.
#                Publish is unreachable unless it passes.
#   publish    → upload everything — tarball, checksum, SBOM, Cosign bundles,
#                AND the *.intoto.jsonl — to a DRAFT release, then publish ONCE.
#
# Enable "release immutability" (Settings -> General -> Releases) alongside
# this: every asset write happens while the release is still a draft, so
# nothing is modified after the release becomes immutable. That is also why the
# generator's own `upload-assets: true` path is NOT used — it attaches to the
# release outside this draft window; here its artifact is carried to the draft
# by the publish job with the rest of the set instead.
#
# First run of this workflow is the first vX.Y.Z tag after it merges. It is
# fail-closed by design: a failing gate leaves only an unpublished draft.
#
# Egress policy: every harden-runner step below runs `egress-policy: audit`
# for now. FOLLOW-UP (deliberate, not yet done): after ONE audited release run
# on this workflow, read the StepSecurity egress report for the build and
# publish jobs and switch those two to `egress-policy: block` with an
# `allowed-endpoints:` list derived from it (github.com, api.github.com,
# *.githubusercontent.com, uploads.github.com, fulcio.sigstore.dev,
# rekor.sigstore.dev, tuf-repo-cdn.sigstore.dev, plus whatever Syft/cosign
# resolve). Flipping to block without an observed baseline would be a guess,
# and a wrong guess fails the release at the publish step.
#
# Tagging: the moving `v1` major tag is NOT managed here (it would violate the
# immutability model this workflow exists to uphold); it is moved by hand after
# a release, and consumers who want immutability pin by full commit SHA.
name: Release (immutable)
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: build, attest & sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless signing + attestation (Fulcio/Sigstore OIDC)
      attestations: write # write build-provenance + SBOM to the attestation store
    outputs:
      # base64 of the `sha256sum` line for the tarball — the SLSA subject list
      # the generator signs. Computed here, on the exact bytes that get shipped.
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit # see header: block + allowed-endpoints after one audited run
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # `git archive HEAD` = the tag's commit as checked out for this push. Only
      # tracked files are packed (no runner state, no dist/), under a
      # `sscsb-action-<tag>/` prefix so the tarball extracts cleanly.
      - name: Package the action source at the tag
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="sscsb-action-${GITHUB_REF_NAME}/" \
            -o "dist/sscsb-action-${GITHUB_REF_NAME}.tar.gz" HEAD
      # A tarball without action.yml is not this action. Assert the artifact is
      # what consumers actually load before anything downstream vouches for it.
      - name: Verify the tarball ships a loadable action
        run: |
          set -euo pipefail
          tarball="dist/sscsb-action-${GITHUB_REF_NAME}.tar.gz"
          for required in action.yml LICENSE scripts/scan/build-record.ts; do
            tar -tzf "$tarball" | grep -qx "sscsb-action-${GITHUB_REF_NAME}/${required}" \
              || { echo "::error::${tarball} has no ${required} entry"; exit 1; }
          done
          tar -tzf "$tarball" | wc -l | xargs printf 'packed %s entries\n'
      - name: Compute checksums
        run: |
          set -euo pipefail
          cd dist
          for f in *.tar.gz; do sha256sum "$f" > "$f.sha256"; done
          cat ./*.sha256
      # The SLSA subject is the tarball ONLY (its bare filename, so slsa-verifier
      # can match the subject name to the file it is handed), encoded exactly as
      # the generator expects: `sha256sum` lines, base64, single line.
      - name: Compute SLSA subject hashes
        id: hash
        run: |
          set -euo pipefail
          cd dist
          hashes="$(sha256sum "sscsb-action-${GITHUB_REF_NAME}.tar.gz" | base64 -w0)"
          [ -n "$hashes" ] || { echo "::error::empty subject list"; exit 1; }
          printf '%s' "$hashes" | base64 -d
          echo "hashes=${hashes}" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance (attestation store)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*.tar.gz
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
          upload-release-assets: false
      - name: Attest the SBOM to the artifact digest (attestation store)
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/sbom.cdx.json
      # Every file must sign, or the step fails — a signing failure on ANY file
      # must never let an unsigned asset reach the published (immutable)
      # release. (`|| exit 1` per-file, not the loop's last-iteration status.)
      - name: Keyless sign all artifacts (bundle = cert + sig + Rekor proof)
        run: |
          set -uo pipefail
          shopt -s nullglob
          for f in dist/*; do
            case "$f" in *.sigstore.json) continue ;; esac
            cosign sign-blob "$f" --bundle "$f.sigstore.json" --yes \
              || { echo "::error::signing failed for $f"; exit 1; }
          done
      # Hand the exact bytes to the gate and the publisher through the run's
      # artifact store; neither job rebuilds anything.
      - name: Upload release set for the gate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # SLSA Build L3 provenance over the tarball digest from `build`. This is a
  # reusable-workflow job (no steps of its own, so no harden-runner here — the
  # generator's jobs run under the generator's own hardening).
  #
  # PINNING EXCEPTION (deliberate, audited): slsa-github-generator MUST be
  # referenced by @vX.Y.Z tag — slsa-verifier validates the trusted builder's
  # ref and the verification fails on SHA or short-tag refs (upstream README;
  # slsa-verifier issue #12). Every other action in this repo is SHA-pinned.
  # The `builder-id` handed to the gate below MUST track this ref — change one,
  # change the other.
  #
  # `upload-assets: false` is what makes this compatible with immutable
  # releases: the *.intoto.jsonl becomes a workflow artifact (named by the
  # `provenance-name` output), and the publish job carries it to the DRAFT
  # release with the rest of the set. The generator never writes to the
  # release itself.
  provenance:
    name: SLSA L3 provenance
    needs: build
    permissions:
      actions: read # read the workflow run context for the provenance
      id-token: write # sign the provenance (Fulcio)
      contents: write # required by the generator's contract even with upload-assets: false
    # Tag-pinned BY DESIGN — see comment above.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: false

  # The verification gate is the repository's ONE provenance-verify
  # implementation (deploy-gate.yml), called as a reusable workflow so the
  # checks that guard publishing are the checks anyone can read there.
  gate:
    name: verify before publish
    needs: [build, provenance]
    permissions:
      contents: read # read attestations + the run's artifacts; nothing else
    uses: ./.github/workflows/deploy-gate.yml
    with:
      artifact-name: release-dist
      provenance-artifact-name: ${{ needs.provenance.outputs.provenance-name }}
      tag: ${{ github.ref_name }}
      # Must track the generator ref pinned in the `provenance` job above.
      builder-id: https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v2.1.0

  publish:
    name: publish immutable release
    needs: [build, provenance, gate] # the gate: publish is unreachable unless verify succeeded
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/publish the release + upload assets to the draft
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit # see header: block + allowed-endpoints after one audited run
      - name: Collect the verified release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      # The provenance lands in its own directory: it is signed by the generator
      # (DSSE, Fulcio) rather than by this workflow's Cosign step, so the
      # "every file has a Cosign bundle" check below must not be asked of it.
      - name: Collect the verified SLSA provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: provenance
      # A partial set is a failed release, not a small one: the tarball, its
      # checksum, the SBOM, one bundle per file, and the L3 provenance must all
      # be present.
      - name: Refuse to publish an incomplete release set
        run: |
          set -uo pipefail
          shopt -s nullglob
          fail=0
          cd dist
          for required in "sscsb-action-${GITHUB_REF_NAME}.tar.gz" \
                          "sscsb-action-${GITHUB_REF_NAME}.tar.gz.sha256" \
                          sbom.cdx.json; do
            [ -s "$required" ] || { echo "::error::missing ${required}"; fail=1; }
          done
          for f in *; do
            case "$f" in *.sigstore.json) continue ;; esac
            [ -s "$f.sigstore.json" ] || { echo "::error::${f} has no Cosign bundle"; fail=1; }
          done
          cd ..
          provenance=(provenance/*.intoto.jsonl)
          if [ ${#provenance[@]} -ne 1 ] || [ ! -s "${provenance[0]}" ]; then
            echo "::error::expected exactly one non-empty *.intoto.jsonl, found ${#provenance[@]}: ${provenance[*]:-none}"
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          ls -l dist provenance
      # Draft-then-publish: EVERY asset write happens while the release is a
      # DRAFT (still mutable); the final publish is the only immutable transition.
      # Re-run guard: an already-PUBLISHED (immutable) release cannot be
      # modified — record `already_published=true` and exit 0 here, and the
      # Publish step below is skipped on that output, instead of failing at the
      # upload or the (now forbidden) draft=false edit.
      - name: Create draft release and upload all assets
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null | grep -qx false; then
            echo "::notice::$GITHUB_REF_NAME is already published (immutable) — nothing to upload"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "already_published=false" >> "$GITHUB_OUTPUT"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes \
            || { echo "::error::failed to create draft release for $GITHUB_REF_NAME"; exit 1; }
          gh release upload "$GITHUB_REF_NAME" dist/* provenance/*.intoto.jsonl --clobber
      - name: Publish (assets + tag become immutable now)
        if: steps.draft.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
